      function prepareSentenceForSplit(sentence) {
        let s = sentence;
        s = s.replace(/park\s+etti/gi, (match) => match.replace(/\s+/, '\u00A0'));
        s = s.replace(/tamir\s+etti/gi, (match) => match.replace(/\s+/, '\u00A0'));
        s = s.replace(/iptal\s+etti/gi, (match) => match.replace(/\s+/, '\u00A0'));
        s = s.replace(/test\s+etmek/gi, (match) => match.replace(/\s+/, '\u00A0'));
        return s;
      }

      function computeHighlights(sentences) {
        const preparedSentences = sentences.map(prepareSentenceForSplit);
        const cleanWord = (w) => w.toLowerCase().replace(/\u00A0/g, ' ').replace(/[.,!?;:()]/g, '');
        const isMatch = (w1, w2) => {
          const c1 = cleanWord(w1);
          const c2 = cleanWord(w2);
          if (c1 === c2) return true;
          if (c1.length >= 4 && c2.startsWith(c1)) return true;
          if (c2.length >= 4 && c1.startsWith(c2)) return true;
          return false;
        };

        const results = [];
        if (preparedSentences.length === 0) return results;

        let currentTokens = preparedSentences[0].split(' ').map(w => ({ word: w, level: 1 }));
        results.push([...currentTokens]);

        for (let i = 1; i < preparedSentences.length; i++) {
          const nextWords = preparedSentences[i].split(' ');
          const lcsMatrix = Array(currentTokens.length + 1).fill(0).map(() => Array(nextWords.length + 1).fill(0));
          for (let j = 1; j <= currentTokens.length; j++) {
            for (let k = 1; k <= nextWords.length; k++) {
              if (isMatch(currentTokens[j-1].word, nextWords[k-1])) {
                lcsMatrix[j][k] = lcsMatrix[j-1][k-1] + 1;
              } else {
                lcsMatrix[j][k] = Math.max(lcsMatrix[j-1][k], lcsMatrix[j][k-1]);
              }
            }
          }
          let j = currentTokens.length;
          let k = nextWords.length;
          const aligned = [];
          while (j > 0 && k > 0) {
            if (isMatch(currentTokens[j-1].word, nextWords[k-1])) {
              aligned.unshift({ word: nextWords[k-1], level: currentTokens[j-1].level });
              j--;
              k--;
            } else if (lcsMatrix[j-1][k] > lcsMatrix[j][k-1]) {
              j--; 
            } else {
              aligned.unshift({ word: nextWords[k-1], level: i + 1 });
              k--;
            }
          }
          while (k > 0) {
            aligned.unshift({ word: nextWords[k-1], level: i + 1 });
            k--;
          }
          currentTokens = aligned;
          results.push([...currentTokens]);
        }
        return results;
      }

      function App() {
        const [mode, setMode] = useState('menu');
        const [themeIndex, setThemeIndex] = useState(0);
        const [level, setLevel] = useState(1);
        const [isRevealed, setIsRevealed] = useState(false);
        const [score, setScore] = useState(0);
        const [showPopup, setShowPopup] = useState(false);
        const [finished, setFinished] = useState(false);
        const [activeWordId, setActiveWordId] = useState(null);

        const startGame = (selectedMode) => {
          setMode(selectedMode);
          setThemeIndex(0);
          setLevel(1);
          setScore(0);
          setIsRevealed(false);
          setFinished(false);
          setShowPopup(false);
          setActiveWordId(null);
        };

        const { trHighlights, enHighlights } = useMemo(() => {
          const currentTheme = THEMES[themeIndex];
          if (!currentTheme) return { trHighlights: [], enHighlights: [] };
          const trSentences = currentTheme.sentences.map(s => s.tr);
          const enSentences = currentTheme.sentences.map(s => s.en);
          return {
            trHighlights: computeHighlights(trSentences),
            enHighlights: computeHighlights(enSentences)
          };
        }, [themeIndex]);

        const handleReveal = () => {
          if (!isRevealed) {
            setIsRevealed(true);
            setScore(s => s + 10);
            setActiveWordId(null);
          }
        };

        const handleNext = () => {
          setActiveWordId(null);
          if (mode === 'elimination') {
            if (level < 4) {
              setShowPopup(true);
            } else {
              if (themeIndex < THEMES.length - 1) {
                setThemeIndex(t => t + 1);
                setLevel(1);
                setIsRevealed(false);
              } else {
                setFinished(true);
              }
            }
          } else if (mode === 'leaguewise') {
            if (themeIndex < THEMES.length - 1) {
              setThemeIndex(t => t + 1);
              setIsRevealed(false);
            } else {
              if (level < 4) {
                setShowPopup(true);
              } else {
                setFinished(true);
              }
            }
          }
        };

        const handleProceedLeague = () => {
          setActiveWordId(null);
          if (mode === 'elimination') {
            setLevel(l => l + 1);
            setIsRevealed(false);
            setShowPopup(false);
          } else if (mode === 'leaguewise') {
            setLevel(l => l + 1);
            setThemeIndex(0);
            setIsRevealed(false);
            setShowPopup(false);
          }
        };

        const renderSentence = (tokens, isTurkish) => {
          return (
            <div className="flex flex-wrap justify-center gap-x-2 gap-y-6 pt-6 pb-2">
              {tokens.map((t, idx) => {
                const wordId = `${level}-${idx}`;
                const isActive = activeWordId === wordId;
                
                let bgClass = "text-slate-800";
                let paddingClass = "";
                
                if (t.level > 1) {
                  paddingClass = "px-2 py-0.5 rounded-md shadow-sm";
                }
                
                if (t.level === 2) bgClass = "bg-yellow-200 text-yellow-950 font-medium";
                else if (t.level === 3) bgClass = "bg-green-300 text-green-950 font-medium";
                else if (t.level === 4) bgClass = "bg-sky-200 text-sky-950 font-medium";

                const cleanWordKey = t.word.toLowerCase().replace(/\u00A0/g, ' ').replace(/[.,!?;:()]/g, '');
                const englishTranslation = DICTIONARY[cleanWordKey];

                return (
                  <span key={idx} className="relative inline-block my-1">
                    {isTurkish && isActive && englishTranslation && (
                      <span 
                        onClick={(e) => { e.stopPropagation(); setActiveWordId(null); }}
                        className="absolute -top-11 left-1/2 -translate-x-1/2 bg-red-600 text-white text-sm font-bold px-3 py-1 rounded-lg shadow-xl whitespace-nowrap z-30 cursor-pointer flex items-center space-x-1"
                      >
                        <span>{englishTranslation}</span>
                        <span className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-red-600"></span>
                      </span>
                    )}
                    <span 
                      onClick={() => isTurkish && setActiveWordId(isActive ? null : wordId)}
                      className={`inline-block leading-relaxed transition-colors duration-300 ${bgClass} ${paddingClass} ${isTurkish ? 'cursor-pointer hover:opacity-80 active:scale-95 select-none' : ''}`}
                      title={isTurkish && englishTranslation ? "Tap to see translation" : ""}
                    >
                      {t.word}
                    </span>
                  </span>
                );
              })}
            </div>
          );
        };

        if (mode === 'menu') {
          return (
            <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
              <div className="max-w-2xl w-full text-center mb-12">
                <h1 className="text-5xl font-extrabold text-slate-800 mb-4 tracking-tight">Turkish Language Mastery</h1>
                <p className="text-lg text-slate-600">Choose your path to mastery. Learn systematically league by league, or master each sentence perfectly before moving on.</p>
              </div>
              
              <div className="grid md:grid-cols-2 gap-6 w-full max-w-4xl">
                <button 
                  onClick={() => startGame('leaguewise')}
                  className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-left border-2 border-transparent hover:border-indigo-500 group"
                >
                  <div className="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <LayersIcon className="w-8 h-8 text-indigo-600" />
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-3">League-Wise Path</h2>
                  <p className="text-slate-600 leading-relaxed">
                    Complete all 16 sentences in Bronze League first, then sequentially advance through Silver, Gold, and Platinum leagues.
                  </p>
                </button>

                <button 
                  onClick={() => startGame('elimination')}
                  className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-left border-2 border-transparent hover:border-emerald-500 group"
                >
                  <div className="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <PlayIcon className="w-8 h-8 text-emerald-600" />
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-3">Elimination Path</h2>
                  <p className="text-slate-600 leading-relaxed">
                    Take one sentence and master it from Bronze all the way to Platinum before moving to the next sentence.
                  </p>
                </button>
              </div>
            </div>
          );
        }

        if (finished) {
          return (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
              <div className="bg-white p-12 rounded-3xl shadow-xl text-center max-w-md w-full">
                <CheckCircleIcon className="w-24 h-24 text-green-500 mx-auto mb-6" />
                <h1 className="text-4xl font-bold text-slate-800 mb-4">You did it!</h1>
                <p className="text-lg text-slate-600 mb-8">You've completed all sentences and mastered every league.</p>
                <div className="flex items-center justify-center space-x-3 bg-slate-100 p-4 rounded-2xl mb-8">
                  <TrophyIcon className="w-8 h-8 text-yellow-500" />
                  <span className="text-3xl font-bold text-slate-800">{score} pts</span>
                </div>
                <button 
                  onClick={() => setMode('menu')}
                  className="px-8 py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 w-full"
                >
                  Return to Menu
                </button>
              </div>
            </div>
          );
        }

        const currentLeagueInfo = LEAGUES[level - 1];
        const popupTitle = mode === 'leaguewise' 
          ? `${currentLeagueInfo.name} Complete!` 
          : "Great Job!";
        const popupSubtitle = mode === 'leaguewise'
          ? "You've successfully translated all sentences in this league."
          : "Get ready for the next challenge.";

        const nextButtonText = mode === 'elimination'
          ? (level < 4 ? `Proceed to ${LEAGUES[level].name}` : "Next Sentence")
          : (themeIndex < THEMES.length - 1 ? "Next Sentence" : `Proceed to ${level < 4 ? LEAGUES[level].name : "Finish"}`);

        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center p-4 md:p-8 font-sans">
            
            {/* Header */}
            <div className="w-full max-w-3xl flex justify-between items-center mb-8">
              <div className="bg-white px-4 py-2 rounded-full shadow-sm flex items-center space-x-2">
                <span className="text-slate-500 font-medium text-sm uppercase tracking-wider">Remaining</span>
                <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-bold">
                  {THEMES.length - themeIndex}
                </span>
              </div>
              <div className="flex items-center space-x-2 bg-white px-5 py-2.5 rounded-full shadow-sm border border-slate-100">
                <TrophyIcon className="w-5 h-5 text-yellow-500" />
                <span className="font-bold text-slate-800 text-lg">{score} pts</span>
              </div>
              <button 
                onClick={() => setMode('menu')} 
                className="text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors"
              >
                Exit Game
              </button>
            </div>

            {/* Main Flashcard Container */}
            <div className="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col min-h-[420px]">
              {/* League Indicator Bar */}
              <div className={`px-6 py-3 text-white font-bold text-center tracking-widest uppercase text-sm ${currentLeagueInfo.color} transition-colors duration-500`}>
                {currentLeagueInfo.name}
              </div>

              <div className="p-8 md:p-12 flex-grow flex flex-col justify-center relative">
                
                {/* Turkish Sentence */}
                <div className="text-2xl md:text-3xl font-medium text-slate-800 leading-relaxed text-center">
                  {renderSentence(trHighlights[level - 1], true)}
                </div>
                
                {isRevealed && (
                  <div className="mt-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="flex items-center justify-center space-x-4 mb-8">
                      <div className="h-px bg-slate-200 flex-grow"></div>
                      <span className="text-slate-400 font-medium text-sm uppercase tracking-wider">English</span>
                      <div className="h-px bg-slate-200 flex-grow"></div>
                    </div>
                    
                    {/* English Sentence */}
                    <div className="text-2xl md:text-3xl font-medium text-slate-600 leading-relaxed text-center">
                      {renderSentence(enHighlights[level - 1], false)}
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Controls */}
            <div className="w-full max-w-3xl mt-8 flex justify-center">
              {!isRevealed ? (
                <button 
                  onClick={handleReveal} 
                  className="px-8 py-5 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all text-xl w-full max-w-md"
                >
                  Tap to Reveal
                </button>
              ) : (
                <button 
                  onClick={handleNext} 
                  className="px-8 py-5 bg-green-500 text-white rounded-2xl font-bold shadow-lg shadow-green-200 hover:bg-green-600 active:scale-95 transition-all text-xl w-full max-w-md flex items-center justify-center space-x-2"
                >
                  <span>{nextButtonText}</span>
                  <ChevronRightIcon className="w-6 h-6" />
                </button>
              )}
            </div>

            {/* Level Up Popup */}
            {showPopup && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl p-10 max-w-sm w-full text-center shadow-2xl animate-in zoom-in-95 duration-200">
                  <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-inner ${LEAGUES[level].color}`}>
                    <TrophyIcon className="w-10 h-10 text-white" />
                  </div>
                  <h2 className="text-3xl font-bold text-slate-800 mb-2">{popupTitle}</h2>
                  <p className="text-slate-500 mb-8 font-medium">{popupSubtitle}</p>
                  <button 
                    onClick={handleProceedLeague} 
                    className={`w-full py-4 text-white rounded-xl font-bold transition-transform active:scale-95 shadow-md ${LEAGUES[level].color}`}
                  >
                    Start {LEAGUES[level].name}
                  </button>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
