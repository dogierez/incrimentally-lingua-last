          "nakit para",
          "dil okulunda",
          "gece vardiyasında",
          "arka sırada",
          "alt güverteye",
          "panik içinde",
          "sakin bir şekilde",
          "özensiz bir şekilde",
          "güvenli bir şekilde",
          "büyük bir hassasiyetle",
          "aldıktan sonra",
          "kaçmadan önce",
          "girmeden önce",
          "La Liga'dan",
          "olduğundan dolayı",
          "göremediğinden dolayı",
          "yaklaştığından dolayı",
          "bulmak için",
          "kazanmak için",
          "gidermek için",
          "dönebilsin diye",
          "başlayabilsin diye",
          "görebilmesi için",
          "iptal ettiğini",
          "gol attığını",
          "iptal etti",
          "tamir etti",
          "park etti",
          "test etmek",
          "transfer edilen",
          "işe alınan",
          "eğitim alan",
          "hasar gören",
          "seyahat eden",
          "olmaya çalışan"
        ];

        compounds.forEach(phrase => {
          const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const pattern = escaped.replace(/\s+/g, '\\s+');
          try {
            const regex = new RegExp(pattern, 'gi');
            s = s.replace(regex, (match) => match.replace(/\s+/g, '\u00A0'));
          } catch (e) {
            s = s.split(phrase).join(phrase.replace(/\s+/g, '\u00A0'));
          }
        });
        return s;
      }

      function computeHighlights(sentences) {
        if (!sentences || !Array.isArray(sentences) || sentences.length === 0) return [];
        try {
          const preparedSentences = sentences.map(prepareSentenceForSplit);
          const cleanWord = (w) => (w || '').toLowerCase().replace(/\u00A0/g, ' ').replace(/[.,!?;:()'"“”‘’]/g, '').trim();
          const isMatch = (w1, w2) => {
            const c1 = cleanWord(w1);
            const c2 = cleanWord(w2);
            if (!c1 || !c2) return false;
            if (c1 === c2) return true;
            if (c1.length >= 4 && c2.startsWith(c1)) return true;
            if (c2.length >= 4 && c1.startsWith(c2)) return true;
            return false;
          };

          const results = [];
          let currentTokens = preparedSentences[0].split(/\s+/).filter(Boolean).map(w => ({ word: w, level: 1 }));
          results.push([...currentTokens]);

          for (let i = 1; i < preparedSentences.length; i++) {
            const nextWords = preparedSentences[i].split(/\s+/).filter(Boolean);
            const lcsMatrix = Array(currentTokens.length + 1).fill(0).map(() => Array(nextWords.length + 1).fill(0));
            for (let j = 1; j <= currentTokens.length; j++) {
              for (let k = 1; k <= nextWords.length; k++) {
                if (isMatch(currentTokens[j-1].word, nextWords[k-1])) {
                  lcsMatrix[j][k] = lcsMatrix[j-1][k-1] + 1;
                } else {
                  lcsMatrix[j][k] = Math.max(lcsMatrix[j-1][k], lcsMatrix[j][k-1]);
                }
              }
            }
            let j = currentTokens.length;
            let k = nextWords.length;
            const aligned = [];
            while (j > 0 && k > 0) {
              if (isMatch(currentTokens[j-1].word, nextWords[k-1])) {
                aligned.unshift({ word: nextWords[k-1], level: currentTokens[j-1].level });
                j--;
                k--;
              } else if (lcsMatrix[j-1][k] > lcsMatrix[j][k-1]) {
                j--; 
              } else {
                aligned.unshift({ word: nextWords[k-1], level: i + 1 });
                k--;
              }
            }
            while (k > 0) {
              aligned.unshift({ word: nextWords[k-1], level: i + 1 });
              k--;
            }
            currentTokens = aligned;
            results.push([...currentTokens]);
          }
          return results;
        } catch (err) {
          console.error("computeHighlights error:", err);
          return sentences.map(s => (s || '').split(/\s+/).filter(Boolean).map(w => ({ word: w, level: 1 })));
        }
      }

      function getCardFontSize(level) {
        if (level === 1) return "text-2xl sm:text-3xl md:text-4xl font-bold";
        if (level === 2) return "text-xl sm:text-2xl md:text-3xl font-bold";
        if (level === 3) return "text-lg sm:text-xl md:text-2xl font-bold";
        return "text-base sm:text-xl md:text-2xl font-bold";
      }

      function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function App() {
        const [mode, setMode] = useState('menu');
        const [cardQueue, setCardQueue] = useState(() => shuffleArray(Array.from({ length: THEMES.length }, (_, i) => i)));
        const [currentIndex, setCurrentIndex] = useState(0);
        const [level, setLevel] = useState(1);
        const [isRevealed, setIsRevealed] = useState(false);
        const [score, setScore] = useState(0);
        const [finished, setFinished] = useState(false);
        const [activeWordId, setActiveWordId] = useState(null);

        const currentThemeIndex = cardQueue[currentIndex] !== undefined ? cardQueue[currentIndex] : 0;

        const startGame = (selectedMode) => {
          setMode(selectedMode);
          const randomizedCards = shuffleArray(Array.from({ length: THEMES.length }, (_, i) => i));
          setCardQueue(randomizedCards);
          setCurrentIndex(0);
          setLevel(1);
          setScore(0);
          setIsRevealed(false);
          setFinished(false);
          setActiveWordId(null);
        };

        const { trHighlights, enHighlights } = useMemo(() => {
          const currentTheme = THEMES[currentThemeIndex] || THEMES[0];
          if (!currentTheme) return { trHighlights: [], enHighlights: [] };
          const trSentences = currentTheme.sentences.map(s => s.tr);
          const enSentences = currentTheme.sentences.map(s => s.en);
          return {
            trHighlights: computeHighlights(trSentences),
            enHighlights: computeHighlights(enSentences)
          };
        }, [currentThemeIndex]);

        const handleReveal = () => {
          if (!isRevealed) {
            setIsRevealed(true);
            setActiveWordId(null);
          }
        };

        const handleAnswer = (isCorrect) => {
          setActiveWordId(null);
          if (isCorrect) {
            setScore(s => s + 10);
          }

          if (mode === 'elimination') {
            if (level < 4) {
              // Automatically upgrade to higher league for this sentence
              setLevel(l => l + 1);
              setIsRevealed(false);
            } else {
              if (currentIndex < cardQueue.length - 1) {
                // Move to next random card
                setCurrentIndex(i => i + 1);
                setLevel(1);
                setIsRevealed(false);
              } else {
                setFinished(true);
              }
            }
          } else if (mode === 'leaguewise') {
            if (currentIndex < cardQueue.length - 1) {
              // Next random card in this league
              setCurrentIndex(i => i + 1);
              setIsRevealed(false);
            } else {
              if (level < 4) {
                // Advance to higher league and reshuffle for the new league
                const nextDeck = shuffleArray(Array.from({ length: THEMES.length }, (_, i) => i));
                setCardQueue(nextDeck);
                setCurrentIndex(0);
                setLevel(l => l + 1);
                setIsRevealed(false);
              } else {
                setFinished(true);
              }
            }
          }
        };

        const renderSentence = (tokens, isTurkish) => {
          // Fallback if tokens are not yet available or empty
          if (!tokens || !Array.isArray(tokens) || tokens.length === 0) {
            const currentTheme = THEMES[currentThemeIndex] || THEMES[0];
            const sentenceObj = (currentTheme && currentTheme.sentences && (currentTheme.sentences[level - 1] || currentTheme.sentences[0])) || { tr: '', en: '' };
            const rawText = isTurkish ? sentenceObj.tr : sentenceObj.en;
            return <span className={isTurkish ? "text-slate-900 font-bold" : "text-slate-800 font-bold"}>{rawText}</span>;
          }

          return (
            <div className="flex flex-wrap justify-center items-center content-center gap-x-1 sm:gap-x-1.5 gap-y-0.5 sm:gap-y-1 py-0.5 text-center w-full">
              {tokens.map((t, idx) => {
                const wordId = `${level}-${idx}`;
                const isActive = activeWordId === wordId;
                
                let bgClass = isTurkish ? "text-slate-900 font-bold" : "text-slate-800 font-bold";
                let paddingClass = "px-0 py-0";
                
                if (t.level > 1) {
                  paddingClass = "px-1 sm:px-1.5 py-0.5 rounded-md shadow-xs";
                }
                
                if (t.level === 2) bgClass = "bg-yellow-200 text-yellow-950 font-bold";
                else if (t.level === 3) bgClass = "bg-green-300 text-green-950 font-bold";
                else if (t.level === 4) bgClass = "bg-sky-200 text-sky-950 font-bold";

                const cleanWordKey = (t.word || '').toLowerCase().replace(/\u00A0/g, ' ').replace(/[.,!?;:()'"“”‘’]/g, '').trim();
                const englishTranslation = DICTIONARY[cleanWordKey];
                const displayWord = (t.word || '').replace(/\u00A0/g, ' ');

                return (
                  <span key={idx} className="relative inline-flex items-center justify-center">
                    {isTurkish && isActive && englishTranslation && (
                      <span 
                        onClick={(e) => { e.stopPropagation(); setActiveWordId(null); }}
                        className="absolute -top-10 sm:-top-11 left-1/2 -translate-x-1/2 bg-red-600 text-white text-xs sm:text-sm font-bold px-2.5 py-1 rounded-lg shadow-2xl whitespace-nowrap z-40 cursor-pointer flex items-center space-x-1 animate-in fade-in zoom-in-95 duration-150"
                      >
                        <span>{englishTranslation}</span>
                        <span className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-red-600"></span>
                      </span>
                    )}
                    <span 
                      onClick={() => isTurkish && setActiveWordId(isActive ? null : wordId)}
                      className={`inline-block leading-snug tracking-tight sm:tracking-normal transition-all duration-150 font-bold ${bgClass} ${paddingClass} ${isTurkish ? 'cursor-pointer hover:opacity-85 active:scale-95 select-none' : ''}`}
                      title={isTurkish && englishTranslation ? "Tap to see translation" : ""}
                    >
                      {displayWord}
                    </span>
                  </span>
                );
              })}
            </div>
          );
        };

        if (mode === 'menu') {
          return (
            <div className="min-h-[100dvh] bg-slate-50 flex flex-col items-center justify-center p-4 sm:p-6 overflow-y-auto">
              <div className="max-w-2xl w-full text-center mb-8 sm:mb-12">
                <h1 className="text-3xl sm:text-5xl font-extrabold text-slate-800 mb-3 sm:mb-4 tracking-tight">Turkish Language Mastery</h1>
                <p className="text-sm sm:text-lg text-slate-600">Choose your path to mastery. Learn systematically league by league, or master each sentence perfectly before moving on.</p>
              </div>
              
              <div className="grid md:grid-cols-2 gap-4 sm:gap-6 w-full max-w-4xl">
                <button 
                  onClick={() => startGame('leaguewise')}
                  className="bg-white p-6 sm:p-8 rounded-2xl sm:rounded-3xl shadow-lg sm:shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-left border-2 border-transparent hover:border-indigo-500 group"
                >
                  <div className="w-12 h-12 sm:w-16 sm:h-16 bg-indigo-100 rounded-xl sm:rounded-2xl flex items-center justify-center mb-4 sm:mb-6 group-hover:scale-110 transition-transform">
                    <LayersIcon className="w-6 h-6 sm:w-8 sm:h-8 text-indigo-600" />
                  </div>
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-2 sm:mb-3">League-Wise Path</h2>
                  <p className="text-slate-600 text-xs sm:text-base leading-relaxed">
                    Complete all 16 sentences in Bronze League first, then sequentially advance through Silver, Gold, and Platinum leagues.
                  </p>
                </button>

                <button 
                  onClick={() => startGame('elimination')}
                  className="bg-white p-6 sm:p-8 rounded-2xl sm:rounded-3xl shadow-lg sm:shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-left border-2 border-transparent hover:border-emerald-500 group"
                >
                  <div className="w-12 h-12 sm:w-16 sm:h-16 bg-emerald-100 rounded-xl sm:rounded-2xl flex items-center justify-center mb-4 sm:mb-6 group-hover:scale-110 transition-transform">
                    <PlayIcon className="w-6 h-6 sm:w-8 sm:h-8 text-emerald-600" />
                  </div>
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-2 sm:mb-3">Elimination Path</h2>
                  <p className="text-slate-600 text-xs sm:text-base leading-relaxed">
                    Take one sentence and master it from Bronze all the way to Platinum before moving to the next sentence.
                  </p>
                </button>
              </div>
            </div>
          );
        }

        if (finished) {
          return (
            <div className="min-h-[100dvh] bg-slate-50 flex items-center justify-center p-4">
              <div className="bg-white p-8 sm:p-12 rounded-3xl shadow-xl text-center max-w-md w-full">
                <CheckCircleIcon className="w-16 h-16 sm:w-24 sm:h-24 text-green-500 mx-auto mb-4 sm:mb-6" />
                <h1 className="text-2xl sm:text-4xl font-bold text-slate-800 mb-3 sm:mb-4">You did it!</h1>
                <p className="text-sm sm:text-lg text-slate-600 mb-6 sm:mb-8">You've completed all sentences and mastered every league.</p>
                <div className="flex items-center justify-center space-x-3 bg-slate-100 p-3 sm:p-4 rounded-2xl mb-6 sm:mb-8">
                  <TrophyIcon className="w-6 h-6 sm:w-8 sm:h-8 text-yellow-500" />
                  <span className="text-2xl sm:text-3xl font-bold text-slate-800">{score} pts</span>
                </div>
                <button 
                  onClick={() => setMode('menu')}
                  className="px-6 py-3.5 sm:px-8 sm:py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 w-full"
                >
                  Return to Menu
                </button>
              </div>
            </div>
          );
        }

        const cardFontSize = getCardFontSize(level);
        const currentLeagueInfo = LEAGUES[level - 1] || LEAGUES[0];

        return (
          <div className="h-[100dvh] max-h-[100dvh] bg-slate-50 flex flex-col justify-between items-center p-2.5 sm:p-4 md:p-6 font-sans overflow-hidden select-none box-border">
            
            {/* Header */}
            <div className="w-full max-w-3xl flex justify-between items-center shrink-0 mb-1 sm:mb-2">
              <div className="bg-white px-3 py-1 sm:px-4 sm:py-1.5 rounded-full shadow-sm flex items-center space-x-1.5 border border-slate-100">
                <span className="text-slate-400 font-medium text-xs uppercase tracking-wider">Remaining</span>
                <span className="bg-slate-100 text-slate-700 px-1.5 py-0.2 rounded-md font-bold text-xs sm:text-sm">
                  {cardQueue.length - currentIndex}
                </span>
              </div>
              <div className="flex items-center space-x-1.5 bg-white px-3.5 py-1 sm:px-4 sm:py-1.5 rounded-full shadow-sm border border-slate-100">
                <TrophyIcon className="w-4 h-4 sm:w-5 sm:h-5 text-yellow-500" />
                <span className="font-bold text-slate-800 text-sm sm:text-base">{score} pts</span>
              </div>
              <button 
                onClick={() => setMode('menu')} 
                className="text-xs sm:text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors px-2 py-1"
              >
                Exit Game
              </button>
            </div>

            {/* Main Flashcard Container */}
            <div className="w-full max-w-3xl bg-white rounded-2xl sm:rounded-3xl shadow-lg border border-slate-100 overflow-hidden flex flex-col flex-1 min-h-0 my-1 sm:my-2">
              {/* League Indicator Bar */}
              <div className={`px-4 py-1.5 sm:py-2 text-white font-bold text-center tracking-widest uppercase text-xs sm:text-sm ${currentLeagueInfo.color} transition-colors duration-500 shrink-0`}>
                {currentLeagueInfo.name}
              </div>

              <div className="p-3 sm:p-5 md:p-6 flex-1 min-h-0 flex flex-col justify-center items-center overflow-y-auto relative">
                
                {/* Turkish Sentence */}
                <div className={`${cardFontSize} text-slate-900 font-bold leading-snug sm:leading-normal text-center w-full max-w-2xl`}>
                  {renderSentence(trHighlights[level - 1], true)}
                </div>
                
                {isRevealed && (
                  <div className="mt-2 sm:mt-4 animate-in fade-in slide-in-from-bottom-2 duration-300 w-full max-w-2xl flex flex-col items-center">
                    <div className="flex items-center justify-center space-x-2 my-1.5 sm:my-2.5 w-full max-w-xs">
                      <div className="h-px bg-slate-200 flex-grow"></div>
                      <span className="text-slate-400 font-bold text-[10px] sm:text-xs uppercase tracking-wider">English</span>
                      <div className="h-px bg-slate-200 flex-grow"></div>
                    </div>
                    
                    {/* English Sentence */}
                    <div className={`${cardFontSize} text-slate-800 font-bold leading-snug sm:leading-normal text-center w-full`}>
                      {renderSentence(enHighlights[level - 1], false)}
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Prompt Screen & Controls */}
            <div className="w-full max-w-3xl shrink-0 mt-1 sm:mt-3 flex justify-center">
              {!isRevealed ? (
                <button 
                  onClick={handleReveal} 
                  className="px-6 py-3.5 sm:py-4 bg-indigo-600 text-white rounded-xl sm:rounded-2xl font-bold shadow-md shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all text-lg sm:text-xl w-full max-w-md"
                >
                  Tap to Reveal
                </button>
              ) : (
                <div className="w-full max-w-md bg-white p-3.5 sm:p-4 rounded-2xl sm:rounded-3xl shadow-lg border border-slate-100 flex flex-col items-center animate-in fade-in zoom-in-95 duration-150">
                  <p className="text-slate-700 font-bold text-sm sm:text-base mb-2.5 sm:mb-3 text-center">Did you get it right?</p>
                  <div className="grid grid-cols-2 gap-2.5 sm:gap-4 w-full">
                    <button 
                      onClick={() => handleAnswer(false)} 
                      className="py-3 sm:py-3.5 px-3 sm:px-5 bg-slate-50 hover:bg-rose-50 hover:border-rose-300 text-slate-700 hover:text-rose-600 rounded-xl sm:rounded-2xl font-bold border border-slate-200 active:scale-95 transition-all flex items-center justify-center space-x-1.5 text-base sm:text-lg shadow-sm"
                    >
                      <XIcon className="w-5 h-5 text-rose-500 shrink-0" />
                      <span>Wrong <span className="text-xs text-slate-400 font-normal">(0 pts)</span></span>
                    </button>
                    <button 
                      onClick={() => handleAnswer(true)} 
                      className="py-3 sm:py-3.5 px-3 sm:px-5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl sm:rounded-2xl font-bold shadow-md shadow-emerald-200 active:scale-95 transition-all flex items-center justify-center space-x-1.5 text-base sm:text-lg"
                    >
                      <CheckIcon className="w-5 h-5 text-white shrink-0" />
                      <span>Correct <span className="text-xs text-emerald-100 font-medium">(+10 pts)</span></span>
                    </button>
                  </div>
                </div>
              )}
            </div>

          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
